
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#151515">
<title>Rire & Chansons — Écouter en direct</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;min-height:100vh;padding:22px;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 50% 15%,#3a2525 0,#171719 48%,#09090b 100%)}
.card{width:100%;max-width:520px;overflow:hidden;text-align:center;border:1px solid #e43c42;border-radius:26px;background:linear-gradient(160deg,#252326,#101012 72%);box-shadow:0 18px 55px #0009}
.top{padding:34px 22px 24px;background:linear-gradient(135deg,#b71e2a,#e74643 48%,#8f1521)}
.mark{display:inline-flex;align-items:center;justify-content:center;width:78px;height:78px;border-radius:50%;background:#fff;color:#d32635;font-size:43px;font-weight:900;box-shadow:0 5px 18px #530c1680}
h1{font-size:clamp(29px,8vw,42px);line-height:1;margin:16px 0 8px;font-weight:900;letter-spacing:-1.5px}
.subtitle{font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.tagline{margin-top:14px;font-size:16px;font-style:italic;color:#ffe6e6}
.content{padding:28px 24px 30px}
.live{display:inline-block;border:1px solid #ff555b;color:#ff777b;padding:7px 15px;border-radius:30px;font-size:12px;font-weight:800;letter-spacing:2px;margin-bottom:22px}
button{width:116px;height:116px;border:4px solid #ff666b;border-radius:50%;background:linear-gradient(145deg,#ff4249,#b70e20);color:white;font-size:48px;box-shadow:0 8px 24px #0008;cursor:pointer}
button:active{transform:scale(.97)}
.status{min-height:24px;margin:18px 0 22px;color:#eee;font-size:15px}
.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px 0 26px}
.pills span{padding:9px 12px;border:1px solid #474044;border-radius:22px;color:#f5d7d8;font-size:12px;font-weight:700}
.note{font-size:14px;line-height:1.6;color:#c8c2c4}
a{display:inline-block;margin-top:8px;padding:12px 18px;border:1px solid #e7474d;border-radius:24px;color:#fff;text-decoration:none;font-weight:700}
a:hover{background:#a71d29}
footer{padding:15px;border-top:1px solid #373237;color:#918a8e;font-size:12px;letter-spacing:1px}
</style>
</head>
<body>
<main class="card">
<header class="top">
<div class="mark">😂</div>
<h1>RIRE &amp; CHANSONS</h1>
<div class="subtitle">La radio du rire</div>
<div class="tagline">Les stars du rire, des sketches et de la musique !</div>
</header>
<section class="content">
<div class="live">● EN DIRECT</div><br>
<button id="playButton" type="button" aria-label="Écouter ou mettre en pause" onclick="toggleRadio()">▶</button>
<div id="status" class="status" aria-live="polite">Appuyez sur ▶ pour écouter</div>
<audio id="radio" preload="none">
<source src="https://streaming.nrjaudio.fm/oug7girb92oc?origine=fluxradios" type="audio/mpeg">
</audio>
<div class="pills"><span>😂 HUMOUR</span><span>🎙️ SKETCHES</span><span>🎵 MUSIQUE</span><span>📻 ÉMISSIONS</span></div>
<div class="note">Retrouvez Rire &amp; Chansons en direct, sur votre téléphone ou votre ordinateur.</div>
<a href="https://www.rireetchansons.fr/webradios/mur-des-radios/rire-chansons" target="_blank" rel="noopener">🌐 Site officiel</a>
</section>
<footer>RIRE &amp; CHANSONS · ÉCOUTE EN LIGNE</footer>
</main>
<script>
const radio=document.getElementById('radio');
const button=document.getElementById('playButton');
const status=document.getElementById('status');
function toggleRadio(){
if(radio.paused){
status.textContent='Connexion à la radio…';
radio.play().then(()=>{button.textContent='Ⅱ';status.textContent='🎵 Rire & Chansons est en lecture';})
.catch(()=>{button.textContent='▶';status.textContent='Le flux ne démarre pas ? Essayez le site officiel ci-dessous.';});
}else{radio.pause();button.textContent='▶';status.textContent='Lecture en pause';}
}
radio.addEventListener('playing',()=>{button.textContent='Ⅱ';status.textContent='🎵 Rire & Chansons est en direct';});
radio.addEventListener('pause',()=>{button.textContent='▶';});
radio.addEventListener('error',()=>{button.textContent='▶';status.textContent='Flux indisponible : essayez le site officiel ci-dessous.';});
</script>
</body>
</html>
